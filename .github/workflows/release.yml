name: Release

on:
  workflow_dispatch:
  # Weekly rebuild to pick up security fixes from the base image, Alpine and PyPI dependencies
  schedule:
    - cron: '42 5 * * 1'

env:
  IMAGE_NAME: qligier/properdocs-materialx

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read versions
        id: versions
        run: |
          . ./versions.env
          echo "materialx_version=${MATERIALX_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.versions.outputs.materialx_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.versions.outputs.materialx_version }}
            type=semver,pattern={{major}},value=${{ steps.versions.outputs.materialx_version }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
