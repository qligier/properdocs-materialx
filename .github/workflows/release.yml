name: Release

on:
  workflow_dispatch:
  # Weekly rebuild to pick up security fixes from the base image, Alpine and PyPI dependencies
  schedule:
    - cron: '42 5 * * 1'

env:
  IMAGE_NAME: qligier/properdocs-materialx
  TEST_IMAGE: properdocs-materialx:test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read versions
        id: versions
        run: |
          . ./versions.env
          echo "materialx_version=${MATERIALX_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.versions.outputs.materialx_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.versions.outputs.materialx_version }}
            type=semver,pattern={{major}},value=${{ steps.versions.outputs.materialx_version }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # Build each platform locally and check that the image works before pushing anything; the builder cache is then
      # reused by the push step. The test site uses the default 'search' plugin, which runs the pagefind binary.
      - name: Test image
        run: |
          site="${RUNNER_TEMP}/test-site"
          for platform in linux/amd64 linux/arm64; do
            echo "::group::Test ${platform}"
            docker buildx build --platform "${platform}" --load --tag "${TEST_IMAGE}" .
            docker run --rm --platform "${platform}" "${TEST_IMAGE}" --version
            docker run --rm --platform "${platform}" --entrypoint sh "${TEST_IMAGE}" -c \
              'git --version && ssh -V && pngquant --version && python -c "import cairosvg, PIL.Image, lxml.etree"'
            rm -rf "${site}" && mkdir "${site}"
            docker run --rm --platform "${platform}" --user "$(id -u):$(id -g)" -v "${site}:/docs" "${TEST_IMAGE}" new .
            printf 'theme:\n  name: materialx\n' >> "${site}/properdocs.yml"
            docker run --rm --platform "${platform}" --user "$(id -u):$(id -g)" -v "${site}:/docs" "${TEST_IMAGE}" build
            test -f "${site}/site/index.html"
            test -f "${site}/site/search/pagefind.js"
            echo "::endgroup::"
          done

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
